name: Simulator repro - capture the Go fatal message

# 目的：把 SFI 在 iOS 模拟器里跑起来，抓 Go 内核打印的 fatal error 文本。
# 设备上的 .ips 只有栈（EXC_BREAKPOINT / SIGTRAP，Library 里 raise），
# 真正的 "fatal error: ..." 是 Go 打到 stderr 的，模拟器能把 stderr 捞出来。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: Run SFI in simulator
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Show Xcode
        run: xcodebuild -version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.10
          cache: false

      - name: Install gomobile
        run: make lib_install

      - name: Build Libbox (iossimulator/arm64)
        env:
          GOTOOLCHAIN: local
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform iossimulator
          test -d Libbox.xcframework
          rm -rf clients/apple/Libbox.xcframework
          cp -R Libbox.xcframework clients/apple/
          lipo -info clients/apple/Libbox.xcframework/ios-arm64_x86_64-simulator/*.a 2>/dev/null || ls clients/apple/Libbox.xcframework

      - name: Build app for simulator
        working-directory: clients/apple
        env:
          DISABLE_SWIFTLINT: "1"
        run: |
          xcodebuild build \
            -skipPackagePluginValidation \
            -scheme SFI \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath "$RUNNER_TEMP/DD" \
            BASE_PACKAGE_IDENTIFIER=io.nekohasekai.sfi \
            APP_GROUP_IDENTIFIER=group.io.nekohasekai.sfi \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | tail -30
          find "$RUNNER_TEMP/DD/Build/Products" -maxdepth 3 -name '*.app' -print

      - name: Boot simulator and launch with console
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' | head -1)
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find "$RUNNER_TEMP/DD/Build/Products" -maxdepth 3 -name '*.app' | head -1)
          echo "APP=$APP"
          test -n "$APP" || { echo '找不到 .app'; exit 1; }
          xcrun simctl install "$UDID" "$APP"
          echo '=== launch ==='
          timeout 60 xcrun simctl launch --console-pty "$UDID" io.nekohasekai.sfi > launch.log 2>&1 || echo "launch exit=$?"
          echo '=== 前 200 行输出 ==='
          head -200 launch.log
          echo '=== 含 fatal/panic 的行 ==='
          grep -nE 'fatal|panic|error|Error|goroutine' launch.log | head -40 || true
          echo '=== 进程状态 ==='
          xcrun simctl spawn "$UDID" launchctl list | grep -i nekohasekai || echo '未在运行'

      - name: Collect crash logs from the simulator
        if: always()
        run: |
          echo '=== 模拟器崩溃报告 ==='
          find ~/Library/Logs/DiagnosticReports -name 'sing-box*' -mmin -30 -print -exec sh -c 'echo "--- $1 ---"; head -c 4000 "$1"' _ {} \; 2>/dev/null | head -120 || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-logs
          path: |
            launch.log
            ~/Library/Logs/DiagnosticReports/
